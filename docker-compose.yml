services:
  finsight-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: finsight-api
    container_name: finsight-api
    # Host networking: the PostgreSQL instance only listens on the VPS's
    # localhost, so the API shares that localhost. It exposes port 3000 there.
    network_mode: host
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    restart: unless-stopped

  finsight-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: finsight-web
    container_name: finsight-web
    # The only publicly exposed port: nginx serves the SPA and proxies /api to
    # the API on the host (see frontend/nginx.conf).
    ports:
      - "${WEB_PORT:-5000}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - finsight-api
    restart: unless-stopped
